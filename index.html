<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS bỏ qua icon trong manifest, chỉ đọc thẻ này. Thiếu nó thì
         "Thêm vào MH chính" sẽ lấy ảnh chụp màn hình làm icon. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Home Health Hub — Smart Family Health & Medication Safety</title>

    <!-- iOS: cho phép "Thêm vào MH chính" chạy toàn màn hình như app thật -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Home Health Hub" />
    <meta name="theme-color" content="#FF6B4B" />
    <meta name="description" content="Home Health Hub — Nền tảng hỗ trợ con cái theo dõi, nhắc nhở và chăm sóc sức khỏe ba mẹ với trí tuệ nhân tạo Gemini AI." />
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Outfit đã bị bỏ: font đó KHÔNG có subset vietnamese (thiếu hẳn dải
         U+1EA0–U+1EF1: ạ ả ấ ầ ậ ắ ặ ẹ ẽ ế ề ệ ị ọ ỏ ố ồ ộ ớ ờ ợ ụ ủ ứ ừ ự).
         Mọi tiêu đề dùng nó rớt sang font hệ thống GIỮA CHỪNG MỘT TỪ.
         Be Vietnam Pro được thiết kế cho tiếng Việt, dấu rõ và cân ở cỡ lớn. -->
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
